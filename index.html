<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Nostra Playlist 🎵</title>
  <style>
    /* Reset di base per evitare scroll orizzontali indesiderati */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    } 

    body {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      text-align: center;
      padding: 16px 12px;
      background-color: #fdfbf7;
      color: #333;
      -webkit-tap-highlight-color: transparent; /* Rimuove l'alone blu al tocco su Android */
    }

    .card {
      background: #ffffff;
      padding: 20px 16px;
      border-radius: 16px;
      width: 100%;
      max-width: 400px;
      margin: 10px auto;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.25rem; /* Usate unità relative per adattarsi al ridimensionamento testo di Android */
      color: #4a4a4a;
      margin-bottom: 20px;
      line-height: 1.3;
    }

    .song {
      margin-bottom: 16px;
      text-align: left;
      background: #f9f9f9;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #eee;
    }

    .song-title {
      font-weight: 600;
      font-size: 0.95rem;
      display: block;
      margin-bottom: 8px;
      color: #2c3e50;
      word-break: break-word; /* Previene tagli se il titolo è lungo */
    }

    /* Ottimizzazione del player audio per dita su schermi touch */
    audio {
      width: 100%;
      height: 44px; /* Dimensione ottimale touch per Android */
      border-radius: 8px;
      outline: none;
    }

    /* Adattamento per schermi molto stretti (< 360px) */
    @media (max-width: 360px) {
      .card {
        padding: 14px 10px;
      }
      h1 {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Matilde e Marco, 12 Settembre 2026 ❤️</h1>

    <!-- CANZONE 1 -->
    <div class="song">
      <span class="song-title">1. Mina - Stringimi forte i polsi</span>
      <audio controls preload="metadata" src="1_Stringimi_polsi.mp3">
        Il tuo browser non supporta la riproduzione audio.
      </audio>
    </div>

    <!-- CANZONE 2 -->
    <div class="song">
      <span class="song-title">2. W. Azevedo - Brasileirinho</span>
      <audio controls preload="metadata" src="2_Brasileirinho.mp3">
        Il tuo browser non supporta la riproduzione audio.
      </audio>
    </div>

    <!-- CANZONE 3 -->
    <div class="song">
      <span class="song-title">3. 1280 Almas - Marinero</span>
      <audio controls preload="metadata" src="3_Marinero.mp3">
        Il tuo browser non supporta la riproduzione audio.
      </audio>
    </div>

</body>
</html>
