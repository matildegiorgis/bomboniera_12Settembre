<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Nostra Playlist 🎵</title>
  <style>
    /* Reset di base */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      text-align: center;
      padding: 16px 12px;
      /* --- AGGIUNTA DELLO SFONDO --- */
      /* Sostituisci 'sfondo-stelle.png' con il percorso corretto se diverso */
      background-image: url('sfondo-stelle.png'); 
      background-size: cover; /* Copre l'intera area */
      background-position: center; /* Centra l'immagine */
      background-repeat: no-repeat; /* Non ripete l'immagine */
      background-attachment: fixed; /* Lo sfondo resta fermo allo scorrere della pagina */
      
      /* Un colore di riserva nel caso l'immagine non carichi */
      background-color: #1a2a4a; 
      
      color: #333;
      -webkit-tap-highlight-color: transparent;
      min-height: 100vh; /* Assicura che il body copra almeno l'altezza dello schermo */
    }

    .card {
      /* Leggera trasparenza per far intravedere lo sfondo mantenendo leggibilità */
      background: rgba(255, 255, 255, 0.92); 
      padding: 25px 20px; /* Aumentato leggermente il padding */
      border-radius: 20px; /* Bordi più morbidi */
      width: 100%;
      max-width: 420px; /* Leggermente più larga */
      margin: 20px auto; /* Più margine sopra e sotto */
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); /* Ombra più profonda per staccare dallo sfondo */
      backdrop-filter: blur(5px); /* Effetto sfocatura sotto la card (per browser supportati) */
    }

    h1 {
      font-size: 1.4rem; /* Leggermente più grande */
      color: #2c3e50;
      margin-bottom: 25px;
      line-height: 1.3;
      font-weight: 700;
    }

    .song {
      margin-bottom: 18px;
      text-align: left;
      background: rgba(249, 249, 249, 0.8);
      padding: 15px;
      border-radius: 14px;
      border: 1px solid rgba(238, 238, 238, 0.7);
    }

    .song-title {
      font-weight: 600;
      font-size: 1rem; /* Leggermente più grande */
      display: block;
      margin-bottom: 10px;
      color: #1a2a4a; /* Colore scuro che richiama il blu dello sfondo */
      word-break: break-word;
    }

    /* Ottimizzazione del player audio */
    audio {
      width: 100%;
      height: 44px;
      border-radius: 8px;
      outline: none;
    }

    /* Personalizzazione base dei controlli audio per webkit (Chrome/Safari/Edge) */
    /* Nota: La personalizzazione completa via CSS è limitata per il tag nativo */
    audio::-webkit-media-controls-panel {
      background-color: #f1f3f4;
    }

    /* Adattamento per schermi molto stretti (< 360px) */
    @media (max-width: 360px) {
      .card {
        padding: 18px 12px;
        margin: 10px auto;
      }
      h1 {
        font-size: 1.2rem;
      }
      .song-title {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>12 Settembre 2026 ❤️</h1>

    <!-- CANZONE 1 -->
    <div class="song">
      <span class="song-title">1. Mina - Stringimi forte i polsi</span>
      <audio controls preload="metadata" src="https://files.catbox.moe/t5lcoi.mp3">
        Il tuo browser non supporta la riproduzione audio.
      </audio>
    </div>

    <!-- CANZONE 2 -->
    <div class="song">
      <span class="song-title">2. W. Azevedo - Brasileirinho</span>
      <audio controls preload="metadata" src="https://files.catbox.moe/nkp1il.mp3">
        Il tuo browser non supporta la riproduzione audio.
      </audio>
    </div>

    <!-- CANZONE 3 -->
    <div class="song">
      <span class="song-title">3. 1280 Almas - Marinero</span>
      <audio controls preload="metadata" src="https://files.catbox.moe/wfstsp.mp3">
        Il tuo browser non supporta la riproduzione audio.
      </audio>
    </div>

  </div> <!-- Chiusura div.card corretta -->

</body>
</html>
